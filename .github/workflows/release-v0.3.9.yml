name: release-v0.3.9

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RELEASE_TAG: v0.3.9

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release v0.3.9]')
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: node/go.sum
      - run: npm ci --no-audit --no-fund
      - name: Build test node
        working-directory: node
        run: |
          mkdir -p ../bin
          CGO_ENABLED=1 go build -trimpath -ldflags "-s -w" -o ../bin/niu-geth-candidate ./cmd/geth
      - run: npm test

  macos:
    needs: test
    runs-on: macos-14
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: node/go.sum
      - name: Install wallet dependencies
        run: npm ci --no-audit --no-fund
      - name: Build NIU node for macOS arm64
        working-directory: node
        run: |
          mkdir -p ../bin
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../bin/niu-geth-candidate ./cmd/geth
          ../bin/niu-geth-candidate version
      - name: Install desktop packager
        working-directory: desktop
        run: npm install
      - name: Build macOS package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac
      - name: Create checksum
        run: |
          file="dist-desktop/NIU-Wallet-v0.3.9-macOS-arm64.dmg"
          shasum -a 256 "$file" > "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: niu-wallet-v0.3.9-macos-arm64
          path: |
            dist-desktop/NIU-Wallet-v0.3.9-macOS-arm64.dmg
            dist-desktop/NIU-Wallet-v0.3.9-macOS-arm64.dmg.sha256
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: node/go.sum
      - name: Install wallet dependencies
        run: npm ci --no-audit --no-fund
      - name: Build NIU node for Windows x64
        shell: pwsh
        working-directory: node
        run: |
          New-Item -ItemType Directory -Force ..\bin | Out-Null
          $env:CGO_ENABLED = '1'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags "-s -w" -o ..\bin\niu-geth-candidate.exe .\cmd\geth
          ..\bin\niu-geth-candidate.exe version
      - name: Install desktop packager
        working-directory: desktop
        run: npm install
      - name: Build Windows package
        working-directory: desktop
        run: npm run dist:win
      - name: Create checksum
        shell: pwsh
        run: |
          $file = 'dist-desktop\NIU-Wallet-v0.3.9-Windows-x64.zip'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  NIU-Wallet-v0.3.9-Windows-x64.zip" | Set-Content "$file.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: niu-wallet-v0.3.9-windows-x64
          path: |
            dist-desktop/NIU-Wallet-v0.3.9-Windows-x64.zip
            dist-desktop/NIU-Wallet-v0.3.9-Windows-x64.zip.sha256
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: niu-wallet-v0.3.9-*
          path: release
          merge-multiple: true
      - name: Publish macOS and Windows v0.3.9
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            macOS Apple Silicon 与 Windows x64 使用同一套 Electron UI、六语言资源和钱包业务代码。

            新增一键发行 ERC-20：固定总量模板没有管理员或增发入口；管理型模板支持发行上限、增发、暂停、销毁和所有权转移。新增 ERC-20 导入、余额查看与转账。

            新增 Solidity 工作台：使用 solc 0.8.37 编译 London EVM 合约，允许导入固定版本的 OpenZeppelin Contracts 5.6.1，支持 Gas 估算、部署、ABI 导入、只读调用和签名写入。

            本版本已通过 22 项自动化回归测试，以及真实双节点测试链上的代币发行/转账和合约部署/读写验证。

            当前安装包未进行商业代码签名或 Apple 公证，智能合约功能也尚未经过独立第三方安全审计。请先用小额测试，核对合约权限，并妥善保存离线备份。
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "NIU Wallet v0.3.9 - ERC-20 + Solidity Studio" --notes "$RELEASE_NOTES"
          gh release upload "$RELEASE_TAG" release/* --clobber
